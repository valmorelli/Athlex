services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atletismo
      POSTGRES_PASSWORD: atletismo_local_dev
      POSTGRES_DB: atletismo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atletismo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atletismo -d atletismo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  atletismo_pgdata:
